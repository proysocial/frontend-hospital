<a
  [routerLink]="link"
  routerLinkActive="bg-[#2166E8] text-white"
  [routerLinkActiveOptions]="{ exact: true }"
  class="flex items-center gap-3 px-4 py-2 rounded-lg cursor-pointer transition
         text-gray-300 hover:bg-[#1b54bd]"
>
  <mat-icon class="text-xl leading-none">
    {{ icon }}
  </mat-icon>

  <span class="text-sm font-medium leading-none">
    {{ label }}
  </span>
</a>
