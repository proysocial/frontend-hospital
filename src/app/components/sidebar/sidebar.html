<aside class="w-64 h-full bg-[#0F172A] text-white flex flex-col justify-between">
    <!-- Sidebar -->
    <div>
        <!-- Cabecera -->
        <div class="px-6 py-8 flex items-center gap-4">
            <img 
                src="assets/essalud-logo2.png" 
                class="w-14 object-contain" 
            />
            <div class="flex flex-col justify-center">
                <h1 class="text-3xl font-bold text-white leading-none tracking-tight">
                    Dashboard
                </h1>
                <p class="text-sm text-gray-500 font-medium whitespace-nowrap mt-1">
                    Hosp. Ramiro Prialé
                </p>
            </div>
        </div>

        <!-- Menu -->
         <nav class="space-y-1 px-3">
            <h1 class="text-2xl text-gray-400 px-3 mb-2 font-bold">GENERAL</h1>

            <app-sidebar-item
                icon="analytics"
                label="Reportes"
                [active]=true
                link="/principal/reportes"
            />

            <h1 class="text-2xl text-gray-400 px-3 mb-2 font-bold">OPERATIVO</h1>

            <app-sidebar-item
                icon="article"
                label="Herramientas"
                link="/principal/herramientas"
            />

         </nav>
    </div>

    <app-user-profile></app-user-profile>

</aside>
