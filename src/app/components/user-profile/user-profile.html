<!-- Card perfil -->
@if (usuario; as u) {
  <div
    class="p-4 border-t border-white/10 cursor-pointer"
    (click)="abrirModal($event)"
  >
    <div class="flex items-center gap-3">

      <div
        class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white">
        {{ iniciales }}
      </div>

      <div>
        <p class="text-sm font-semibold text-white">
          {{ u.nombre }} {{ u.apellido }}
        </p>
        <p class="text-xs text-gray-400">
          Administrador
        </p>
      </div>

    </div>

    <button
      type="button"
      class="mt-3 w-full text-sm bg-red-600 hover:bg-red-700 transition text-white py-2 rounded-lg"
      (click)="logout($event)"
    >
      Cerrar sesión
    </button>
  </div>
}

<!-- Modal -->
@if (isOpen && usuarioEditando) {
  <div
    class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50"
    (click)="cerrarModal()"
  >
    <div
      class="bg-white rounded-2xl shadow-2xl w-[460px] overflow-hidden"
      (click)="$event.stopPropagation()"
    >

      <!-- Header -->
      <div class="bg-blue-600 px-6 py-4">
        <h2 class="text-white text-xl font-semibold">
          Editar Perfil
        </h2>
        <p class="text-blue-100 text-sm mt-1">
          Para actualizar guarde los cambios realizados.
        </p>
      </div>

      <!-- Body -->
      <div class="p-6 space-y-4 bg-white">

        <!-- Nombre -->
        <div>
          <label class="text-sm text-gray-700 font-medium">Nombre</label>
          <input
            type="text"
            [(ngModel)]="usuarioEditando.nombre"
            name="nombre"
            class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2
                   bg-white text-gray-900 placeholder-gray-400
                   focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <!-- Apellido -->
        <div>
          <label class="text-sm text-gray-700 font-medium">Apellido</label>
          <input
            type="text"
            [(ngModel)]="usuarioEditando.apellido"
            name="apellido"
            class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2
                   bg-white text-gray-900 placeholder-gray-400
                   focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <!-- Correo -->
        <div>
          <label class="text-sm text-gray-700 font-medium">Correo electrónico</label>
          <input
            type="email"
            [(ngModel)]="usuarioEditando.correo"
            name="correo"
            class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2
                   bg-white text-gray-900 placeholder-gray-400
                   focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <!-- Nueva contraseña -->
        <div>
          <label class="text-sm text-gray-700 font-medium">
            Actualizar contraseña (opcional)
          </label>
          <input
            type="text"
            placeholder="Nueva contraseña"
            [(ngModel)]="nuevaPassword"
            name="nuevaPassword"
            class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2
                   bg-white text-gray-900 placeholder-gray-400
                   focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <!-- Confirmar contraseña -->
        <div>
          <input
            type="text"
            placeholder="Confirmar contraseña"
            [(ngModel)]="confirmarPassword"
            name="confirmarPassword"
            class="w-full border border-gray-300 rounded-lg px-3 py-2
                   bg-white text-gray-900 placeholder-gray-400
                   focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>

      </div>

      <!-- Footer -->
      <div class="bg-gray-50 px-6 py-4 flex justify-end gap-3">

        <button
          type="button"
          class="px-5 py-2 rounded-lg bg-gray-300 hover:bg-gray-400 text-gray-700 font-medium transition"
          (click)="cerrarModal()"
        >
          Cancelar
        </button>

        <button
          type="button"
          class="px-5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-semibold shadow transition"
          (click)="guardarCambios()"
        >
          Guardar cambios
        </button>

      </div>

    </div>
  </div>
}
