
<div class="user-profile-container">
  
  @if (usuario) {
    <div
      class="profile-sidebar-item"
      (click)="abrirModal($event)"
    >
      <div class="profile-avatar">
        {{ iniciales }}
      </div>

      <div class="profile-info">
        <p class="profile-name">
          {{ nombreCompleto }}
        </p>
        <p class="profile-role">
          {{ usuario.rol || 'Administrador' }}
        </p>
      </div>
    </div>
  }

  <!-- EDICION DE PERFIL -->
  @if (isOpen && usuario) {
    <div class="modal-overlay" (click)="cancelarEdicion()">
      
      <div class="modal-content" (click)="$event.stopPropagation()">
        
        <!-- Encabezado -->
        <div class="modal-header">
          <h2 class="modal-title">Editar Perfil</h2>
          <button class="modal-close" (click)="cancelarEdicion()">
            <mat-icon>close</mat-icon>
          </button>
        </div>

        <!-- Subtítulo -->
        <p class="modal-subtitle">
          Para actualizar guarde los cambios realizados.
        </p>

        <!-- Formulario -->
        <div class="form-container">

          <!-- ESTADO DE LECTURA -->
          <div class="form-group">
            <label class="form-label">Nombre</label>
            <input
              type="text"
              class="form-input readonly"
              [value]="usuario.nombre"
              readonly
            >
          </div>

          <!-- LECTURA -->
          <div class="form-group">
            <label class="form-label">Apellido Materno</label>
            <input
              type="text"
              class="form-input readonly"
              [value]="usuario.apellido_materno"
              
            >
          </div>

          <!--LECTURA-->
          <div class="form-group">
            <label class="form-label">Apellido Paterno</label>
            <input
              type="text"
              class="form-input readonly"
              [value]="usuario.apellido_paterno"
              
            >
          </div>

          <!-- Correo -->
          <div class="form-group">
            <label class="form-label">Correo electrónico</label>
            <input
              type="email"
              class="form-input"
              [(ngModel)]="usuario.correo"
              placeholder="correo@ejemplo.com"
              readonly
            >
          </div>

          <!-- Contraseña -->
          <div class="form-group">
            <label class="form-label">Actualizar contraseña</label>
            <input
              type="password"
              class="form-input"
              [(ngModel)]="nuevaPassword"
              placeholder="Nueva contraseña"
            >
          </div>

        </div>

        <!-- Botones de acción -->
        <div class="modal-actions">
          <button 
            class="btn btn-secondary" 
            (click)="cancelarEdicion()"
          >
            Cancelar
          </button>

          <button 
            class="btn btn-primary" 
            (click)="guardarCambios()"
          >
            Guardar cambios
          </button>
        </div>

      </div>
    </div>
  }
</div>
