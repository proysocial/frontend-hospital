@if (loading()) {
    <div class="fixed inset-0 z-9999 flex items-center justify-center bg-slate-900/40">
        <div class="bg-white rounded-2xl p-10 flex flex-col items-center gap-5 shadow-2xl">

            <img src="assets/essalud-logo2.png" class="w-40 animate-bounce"/>

            <p class="text-sky-700 font-bold text-xl">Cargando...</p>

            <div class="flex gap-2">
            <span class="w-3 h-3 bg-sky-500 rounded-full animate-bounce"></span>
            <span class="w-3 h-3 bg-sky-500 rounded-full animate-bounce delay-150"></span>
            <span class="w-3 h-3 bg-sky-500 rounded-full animate-bounce delay-300"></span>
            </div>

        </div>
    </div>
}
