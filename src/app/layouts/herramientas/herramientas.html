<div class="h-full bg-gray-100 p-1 flex flex-col overflow-hidden">

  @if (isHandset$ | async) {
    <div class="flex items-center justify-center h-full">
      <p>Aún no se elabora una parte para móvil</p>
    </div>
  }

  @if (isDesktop$ | async) {

    <!-- HEADER -->
    <div class="flex items-center justify-between mb-4 shrink-0">
        <button
        class="flex items-center gap-2 bg-green-500 hover:bg-green-600
                text-white px-4 py-2 rounded-lg shadow transition"
        >
        <mat-icon>add</mat-icon>
        <span class="text-sm font-medium">Crear Reporte</span>
        </button>
    </div>

    <!-- CONTENIDO -->
    <div class="flex-1 bg-blue-700 rounded-lg shadow overflow-hidden">
        <!-- aquí va la tabla -->
    </div>

    }

</div>
